<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>خطاك</title>
<style>
:root{--bg:#f7f5f6;--card:#fff;--tx:#241a1d;--mut:#6f6266;--ac:#8f1f3a;--ac2:#f3dfe4;--ok:#1f8a4c;--bad:#b42318;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#171214;--card:#241c1f;--tx:#f3eaed;--mut:#b3a3a8;--ac:#e0708b;--ac2:#3a2530;--ok:#4cc27f;--bad:#ff8a80}}
:root[data-theme="dark"]{--bg:#171214;--card:#241c1f;--tx:#f3eaed;--mut:#b3a3a8;--ac:#e0708b;--ac2:#3a2530;--ok:#4cc27f;--bad:#ff8a80}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;line-height:1.5}
main{max-width:480px;margin:0 auto;padding:16px}
h1{font-size:28px;margin:8px 0 2px;color:var(--ac)}
.sub{color:var(--mut);margin:0 0 16px;font-size:14px}
.card{background:var(--card);border-radius:16px;padding:16px;margin-bottom:12px;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.lab{color:var(--mut);font-size:14px}
.val{font-size:34px;font-weight:700;font-variant-numeric:tabular-nums}
.st{font-weight:600}.ok{color:var(--ok)}.bad{color:var(--bad)}
button{width:100%;border:0;border-radius:12px;padding:14px;font-size:17px;font-weight:600;background:var(--ac);color:#fff;font-family:inherit}
button.alt{background:var(--ac2);color:var(--ac);margin-top:8px}
.bar{height:12px;border-radius:6px;background:var(--ac2);overflow:hidden;margin-top:10px}
.bar>i{display:block;height:100%;width:0;background:var(--ac);transition:width .1s}
.note{color:var(--mut);font-size:13px;margin-top:8px}
</style>
</head>
<body>
<main>
<h1>خُطاك</h1>
<p class="sub">متابعة المشي أثناء الحركة اليومية</p>

<div class="card">
  <div class="row"><span class="lab">حالة الجورب</span><span id="st" class="st bad">غير متصل</span></div>
  <button id="btn" style="margin-top:12px">اتصال بالجورب</button>
  <div id="msg" class="note"></div>
</div>

<div class="card">
  <div class="row"><span class="lab">عدد الخطوات (تقدير)</span><span id="steps" class="val">0</span></div>
  <button id="reset" class="alt">تصفير العداد</button>
</div>

<div class="card">
  <div class="row"><span class="lab">الضغط تحت القدم</span><span id="fsr" class="val">0</span></div>
  <div class="bar"><i id="fbar"></i></div>
</div>

<div class="card">
  <div class="row"><span class="lab">شدة حركة القدم</span><span id="acc" class="val">0</span></div>
  <div class="note">القيمة 100 تقريباً عندما يكون الحساس ساكناً. المحاور: <span id="axes">0, 0, 0</span></div>
</div>

<p class="note">القياسات تقديرية في هذه النسخة التجريبية.</p>
</main>

<script>
const SERVICE = "4fafc201-1fb5-459e-8fcc-c5c9c331914b";
const CHAR = "beb5483e-36e1-4688-b7f5-ea07361b26a8";
const $ = id => document.getElementById(id);
let steps = 0, lastStep = 0, device = null;

function setStatus(text, ok) {
  $("st").textContent = text;
  $("st").className = "st " + (ok ? "ok" : "bad");
  $("btn").textContent = ok ? "قطع الاتصال" : "اتصال بالجورب";
}

function onData(e) {
  const txt = new TextDecoder().decode(e.target.value).trim();
  const p = txt.split(",").map(Number);
  if (p.length < 4 || p.some(isNaN)) return;
  const [f, x, y, z] = p;
  $("fsr").textContent = f;
  $("fbar").style.width = Math.min(100, Math.sqrt(f / 4095) * 100) + "%";
  const m = Math.hypot(x, y, z);
  $("acc").textContent = Math.round(m);
  $("axes").textContent = x + ", " + y + ", " + z;
  const now = Date.now();
  if (m > 140 && now - lastStep > 350) {
    steps++;
    lastStep = now;
    $("steps").textContent = steps;
  }
}

async function connect() {
  if (!navigator.bluetooth) {
    $("msg").textContent = "هذا المتصفح لا يدعم البلوتوث. افتح الصفحة من تطبيق Bluefy.";
    return;
  }
  try {
    $("msg").textContent = "جاري البحث عن Khutak...";
    device = await navigator.bluetooth.requestDevice({
      filters: [{ name: "Khutak" }],
      optionalServices: [SERVICE]
    });
    device.addEventListener("gattserverdisconnected", () => setStatus("غير متصل", false));
    const server = await device.gatt.connect();
    const service = await server.getPrimaryService(SERVICE);
    const ch = await service.getCharacteristic(CHAR);
    await ch.startNotifications();
    ch.addEventListener("characteristicvaluechanged", onData);
    setStatus("متصل", true);
    $("msg").textContent = "";
  } catch (err) {
    $("msg").textContent = "تعذر الاتصال: " + err.message;
    setStatus("غير متصل", false);
  }
}

$("btn").addEventListener("click", () => {
  if (device && device.gatt.connected) device.gatt.disconnect();
  else connect();
});
$("reset").addEventListener("click", () => { steps = 0; $("steps").textContent = 0; });
</script>
</body>
</html>
